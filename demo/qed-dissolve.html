<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QED — Particle Dissolve Footer</title>
<style>
  :root{
    --paper:#f4f2ed;
    --ink:#1a1a18;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  #stagewrap{
    position:fixed; inset:0;
    background:var(--paper);
  }
  #stage{display:block; width:100%; height:100%;}
  /* transparent, keyboard-reachable hit targets aligned to the canvas text */
  #hits{position:absolute; inset:0;}
  #hits a{
    position:absolute; display:block;
    text-indent:-9999px; overflow:hidden; white-space:nowrap;
    border:0; outline:0; cursor:pointer;
  }
  #hits a:focus-visible{outline:0}
  #replay{
    position:absolute; right:18px; bottom:14px;
    font:500 11px/1 system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase;
    color:#8b8880; background:transparent; border:0; padding:8px 10px; cursor:pointer;
    opacity:.55; transition:opacity .25s ease;
  }
  #replay:hover,#replay:focus-visible{opacity:1; color:var(--ink)}
  @media (prefers-reduced-motion: reduce){ #replay{display:none} }
</style>
</head>
<body>
<div id="stagewrap">
  <canvas id="stage"></canvas>
  <div id="hits"></div>
  <button id="replay" type="button">Replay</button>
</div>
<script>
(() => {
"use strict";

/* ------------------------------------------------------------------ *
 *  QED — particle dissolve footer
 *  Everything (grid, mountains, logo, type) is rendered to canvas in a
 *  fixed "design space", then revealed / eroded through a noisy
 *  horizontal threshold mask. Flecks are spawned along the live edge.
 * ------------------------------------------------------------------ */

let DW = 1795, DH = 1125;            // design space (set by the active layout)
const PAPER = '#f4f2ed';
const GRID  = 'rgba(160,156,146,.55)';
const HEAD  = '#1b1b19';
const MUTED = '#5c5b56';
const CELL  = 2;                      // mask cell size, css px -> fleck grain
const EDGE  = 0.170;                  // width of the dissolve band (0..1 of W)
const RAMP  = 0.012;                  // per-cell fade — near-binary, edges stay hard

const FONT  = 'system-ui,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif';

const prefersStill = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const FREEZE = params.has('t') ? parseFloat(params.get('t')) : null;

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const hits = document.getElementById('hits');

let W = 0, H = 0, DPR = 1, S = 1, offX = 0, offY = 0;
let scene, sctx;                      // static art (grid + mountains + logo)
let maskCv, mctx, maskImg;            // low-res dissolve mask
let MW = 0, MH = 0;
let thr, ink;                         // threshold field + ink density
let parts = [];

/* -------------------------- tiny deterministic rng ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd = mulberry32(20260828);
function rr(a,b){return a+(b-a)*rnd()}

function hash1(n,s){const x=Math.sin(n*127.1+s*311.7)*43758.5453;return x-Math.floor(x)}
function vnoise1(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash1(i,s)*(1-u)+hash1(i+1,s)*u}
function fbm1(x,s,oct){oct=oct||5;let a=.5,sum=0,f=1;for(let o=0;o<oct;o++){sum+=a*vnoise1(x*f,s+o*17);f*=2.03;a*=.5}return sum}
// ridged multifractal — creases instead of blobs, which is what makes rock read as rock
function ridged1(x,s,oct){oct=oct||4;let a=.55,sum=0,f=1;for(let o=0;o<oct;o++){const n=1-Math.abs(vnoise1(x*f,s+o*13)*2-1);sum+=a*n*n;f*=2.11;a*=.52}return sum}
function hash2(i,j,s){const x=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return x-Math.floor(x)}
function vnoise2(x,y,s){
  const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const a=hash2(i,j,s),b=hash2(i+1,j,s),c=hash2(i,j+1,s),d=hash2(i+1,j+1,s);
  return (a*(1-ux)+b*ux)*(1-uy)+(c*(1-ux)+d*ux)*uy;
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=t=>t*t*t*(t*(t*6-15)+10);   // smootherstep — a decisive front

/* --------------------------- footer content ----------------------- */
const COLS = [
  {title:'Product',   items:['Platform','Solutions','Security']},
  {title:'Company',   items:['About','Careers','Contact']},
  {title:'Resources', items:['Research','Documentation','Blog']},
];
const LAYOUTS = {
  // desktop: logo + three link columns across four grid cells
  wide: {
    DW:1795, DH:1125, mSpan:1,
    gx:[80,485,895,1305,1710], gy:80,
    logoCX:282.5, logoCY:186, markS:57, wordF:62, wordGap:22,
    tagF:20, tagY:[261,288], copyY:342,
    colCX:[690,1100,1507.5], headY:185, itemY:231, itemDY:49,
    headF:26, itemF:21, tick:20, tickLen:11
  },
  // portrait / small screens: logo stacked above three tighter columns
  narrow: {
    DW:820, DH:1400, mSpan:0.52,    // show the middle half of the range, full size
    gx:[30,283,537,790], gy:60,
    logoCX:410, logoCY:172, markS:60, wordF:64, wordGap:20,
    tagF:22, tagY:[258,288], copyY:348,
    colCX:[156.7,410,663.3], headY:452, itemY:502, itemDY:52,
    headF:25, itemF:20, tick:13, tickLen:8
  }
};
let L = LAYOUTS.wide;

// live hover/focus state, one eased value per link
const links = [];
COLS.forEach((c,ci)=>c.items.forEach((label,ii)=>{
  links.push({label, ci, ii, h:0, target:0, x:0, y:0, w:0});
}));
function applyLayout(name){
  L = LAYOUTS[name];
  DW = L.DW; DH = L.DH;
  for(const k of links){ k.x = L.colCX[k.ci]; k.y = L.itemY + k.ii*L.itemDY; }
}

/* ------------------------------------------------------------------ *
 *  Pen-and-ink mountain engraving
 * ------------------------------------------------------------------ */

// batches short strokes so the whole range is a handful of stroke() calls
function Pen(g){
  this.g = g; this.buckets = new Map();
}
Pen.prototype.line = function(x1,y1,x2,y2,alpha,width){
  const a = Math.round(clamp(alpha,0,1)*10)/10;
  const w = Math.round(width*10)/10;
  const k = a+'|'+w;
  let b = this.buckets.get(k);
  if(!b){ b = {a:a, w:w, p:new Path2D()}; this.buckets.set(k,b); }
  b.p.moveTo(x1,y1); b.p.lineTo(x2,y2);
};
Pen.prototype.flushInto = function(g){
  g.lineCap = 'round';
  for(const b of this.buckets.values()){
    if(b.a <= 0.02) continue;
    g.strokeStyle = 'rgba(26,26,24,'+b.a+')';
    g.lineWidth = b.w;
    g.stroke(b.p);
  }
  this.buckets.clear();
};
Pen.prototype.flush = function(){
  const g = this.g;
  g.lineCap = 'round';
  for(const b of this.buckets.values()){
    if(b.a <= 0.02) continue;
    g.strokeStyle = 'rgba(26,26,24,'+b.a+')';
    g.lineWidth = b.w;
    g.stroke(b.p);
  }
  this.buckets.clear();
};

/* ------------------------------------------------------------------ *
 *  Faceted peaks
 *
 *  A mountain is an apex with a fan of jagged ridge lines falling to its
 *  base. Adjacent ridges bound a FACET — one plane of rock that is hatched
 *  as a unit: bright snow, grey rock or near-black shadow. Hard planes
 *  meeting at sharp aretes is what makes the range read as cut stone
 *  instead of fuzz.
 * ------------------------------------------------------------------ */

function ridgeline(ax, ay, bx, by, seed, jag){
  const n = 24, pts = new Array(n+1);
  for(let i=0;i<=n;i++){
    const t = i/n;
    const bow = Math.pow(t, 1.22);               // concave — steep at the summit
    let x = ax + (bx-ax)*t;
    let y = ay + (by-ay)*bow;
    const amp = jag * Math.pow(Math.sin(Math.min(1, t*1.06)*Math.PI), 0.6);
    x += (ridged1(t*6.5 + seed*13.7, seed) - .45) * amp;
    y += (vnoise1(t*13 + seed*7.1, seed+5) - .5) * amp * .8;
    pts[i] = [x, y];
  }
  pts[0] = [ax, ay];
  return pts;
}

function buildMountain(cfg){
  const {ax, ay, w, by, seed} = cfg;
  const rng = mulberry32(seed*7919 + 11);
  const R = (lo,hi)=>lo+(hi-lo)*rng();
  const k = cfg.spurs;
  const ridges = [];
  for(let i=0;i<=k;i++){
    const t = i/k;
    const bx = ax - w + 2*w*t + R(-w*0.05, w*0.05);
    // spurs near the centre run toward the viewer, so their feet sit lower
    const bY = by + Math.sin(t*Math.PI)*cfg.dip + R(-10, 10);
    const jag = cfg.jag * (0.75 + 0.7*Math.abs(t-0.5)*2);
    ridges.push(ridgeline(ax, ay + (i===0||i===k ? 0 : R(0, 14)), bx, bY, seed + i*17, jag));
  }

  // facets between neighbouring ridges
  const facets = [];
  for(let i=0;i<k;i++){
    const A = ridges[i], B = ridges[i+1];
    const poly = new Path2D();
    poly.moveTo(A[0][0], A[0][1]);
    for(const q of A) poly.lineTo(q[0], q[1]);
    poly.lineTo(B[B.length-1][0], B[B.length-1][1]);
    for(let j=B.length-1;j>=0;j--) poly.lineTo(B[j][0], B[j][1]);
    poly.closePath();
    const mbx = (A[A.length-1][0] + B[B.length-1][0])/2;
    const mby = (A[A.length-1][1] + B[B.length-1][1])/2;
    facets.push({poly, mbx, mby, i});
  }

  // tone: light from the upper-left, so right-facing planes fall into shadow.
  // Adjacent facets are pushed apart so every arete is a visible tone break.
  for(const f of facets){
    const dirx = clamp((f.mbx - ax)/w, -1, 1);
    f.tone = clamp(0.52 + dirx*0.62 + R(-0.14, 0.14), 0.02, 1);
  }
  for(let i=1;i<facets.length;i++){
    const d = facets[i].tone - facets[i-1].tone;
    if(Math.abs(d) < 0.30){
      const push = (0.30 - Math.abs(d)) * (d >= 0 ? 1 : -1);
      facets[i].tone = clamp(facets[i].tone + push*0.8, 0.02, 1);
      facets[i-1].tone = clamp(facets[i-1].tone - push*0.35, 0.02, 1);
    }
  }

  // outline of the whole mass, for occlusion + the crisp skyline
  const out = new Path2D();
  const Lr = ridges[0], Rr = ridges[k];
  out.moveTo(Lr[Lr.length-1][0], Lr[Lr.length-1][1]);
  for(let j=Lr.length-1;j>=0;j--) out.lineTo(Lr[j][0], Lr[j][1]);
  for(const q of Rr) out.lineTo(q[0], q[1]);
  out.closePath();
  return {cfg, ridges, facets, out, ax, ay, w};
}

// hatch one facet: parallel broken strokes along its fall line, spacing and
// weight from tone; the darkest planes get cross-hatch until they read black.
function hatchFacet(g, M, f, o){
  const {ax, ay} = M;
  let dx = f.mbx - ax, dy = f.mby - ay;
  const L = Math.hypot(dx, dy) || 1;
  dx/=L; dy/=L;
  const px = -dy, py = dx;
  const t = f.tone;

  // rendering recipe per tone band
  let passes, gap, alpha, wgt, snow;
  if(t < 0.24){       passes=1; gap=8.5; alpha=.30; wgt=.7;  snow=.66; }
  else if(t < 0.45){  passes=1; gap=5.6; alpha=.42; wgt=.8;  snow=.40; }
  else if(t < 0.66){  passes=1; gap=3.6; alpha=.60; wgt=.9;  snow=.14; }
  else if(t < 0.85){  passes=2; gap=2.9; alpha=.72; wgt=1.0; snow=0;   }
  else {              passes=3; gap=2.0; alpha=.95; wgt=1.15; snow=0;  }
  gap *= o.k; wgt *= o.k;

  g.save();
  g.clip(f.poly);
  const reach = L*1.25;
  const halfW = M.w*1.1;
  for(let pass=0; pass<passes; pass++){
    // each extra pass rotates a touch — classic cross-hatch
    const rot = pass*0.30;
    const c = Math.cos(rot), sn = Math.sin(rot);
    const ddx = dx*c - dy*sn, ddy = dx*sn + dy*c;
    const ppx = -ddy, ppy = ddx;
    const spacing = gap*(1 + pass*0.35);
    for(let off = -halfW; off <= halfW; off += spacing){
      const jo = off + rr(-spacing*0.3, spacing*0.3);
      let sx = ax + ppx*jo - ddx*L*0.08;
      let sy = ay + ppy*jo - ddy*L*0.08;
      // broken into dashes with hand jitter
      let dpos = rr(0, 10*o.k);
      while(dpos < reach){
        const dl = rr(12, 30)*o.k;
        const gpost = rr(1.5, 4.5)*o.k;
        const x1 = sx + ddx*dpos, y1 = sy + ddy*dpos;
        const frac = dpos/reach;
        if(snow > 0 && frac < snow*(0.8 + 0.45*vnoise1(jo/(26*o.k), M.cfg.seed+3))){
          dpos += dl + gpost; continue;      // bare snow near the summit
        }
        const x2 = sx + ddx*(dpos+dl) + rr(-1,1)*o.k;
        const y2 = sy + ddy*(dpos+dl) + rr(-1,1)*o.k;
        const breathe = 0.72 + 0.55*vnoise1((jo*0.7 + dpos*0.9)/(34*o.k), M.cfg.seed+7);
        o.pen.line(x1, y1, x2, y2, alpha*o.a*breathe, wgt);
        dpos += dl + gpost;
      }
    }
  }
  o.pen.flushInto(g);
  g.restore();
}

function drawMountain(g, M, o){
  // paper knock-out so this mass occludes what is behind it
  g.fillStyle = PAPER;
  g.fill(M.out);

  for(const f of M.facets) hatchFacet(g, M, f, o);

  // aretes — the internal ridges, drawn as crisp creases
  g.lineJoin = 'round'; g.lineCap = 'round';
  for(let i=1;i<M.ridges.length-1;i++){
    const rl = M.ridges[i];
    // heavier where the facets it separates contrast strongly
    const c = Math.abs(M.facets[i].tone - M.facets[i-1].tone);
    g.strokeStyle = 'rgba(26,26,24,'+(o.a*(0.30 + 0.55*c)).toFixed(3)+')';
    g.lineWidth = o.k*(0.8 + 0.7*c);
    g.beginPath();
    g.moveTo(rl[0][0], rl[0][1]);
    for(let j=1;j<rl.length;j++){
      if(vnoise1(j*1.7 + i*3.1, M.cfg.seed+29) < 0.80) g.lineTo(rl[j][0], rl[j][1]);
      else g.moveTo(rl[j][0], rl[j][1]);
    }
    g.stroke();
  }

  // skyline — always the strongest line in the drawing
  g.strokeStyle = 'rgba(26,26,24,'+(o.a*0.95).toFixed(3)+')';
  g.lineWidth = o.k*1.5;
  g.stroke(M.out);
}

function drawConifer(g, x, y, h, alpha){
  const w = h*0.34;
  g.beginPath();
  g.moveTo(x, y - h);
  let side = 1, py = y - h, pw = 0;
  const tiers = Math.max(4, Math.round(h/9));
  // right edge down
  for(let i=1;i<=tiers;i++){
    const t = i/tiers;
    const cw = w*Math.pow(t,0.85);
    const cy = y - h + h*t;
    g.lineTo(x + cw*rr(.75,1.05), cy - h/tiers*0.35);
    g.lineTo(x + cw*rr(.45,.7),  cy);
  }
  g.lineTo(x + w*0.10, y);
  g.lineTo(x - w*0.10, y);
  // left edge up
  for(let i=tiers;i>=1;i--){
    const t = i/tiers;
    const cw = w*Math.pow(t,0.85);
    const cy = y - h + h*t;
    g.lineTo(x - cw*rr(.45,.7), cy);
    g.lineTo(x - cw*rr(.75,1.05), cy - h/tiers*0.35);
  }
  g.closePath();
  g.fillStyle = 'rgba(26,26,24,'+alpha+')';
  g.fill();
}

function drawTreeband(g, cfg){
  const trees = [];
  for(let i=0;i<cfg.count;i++){
    const t = Math.pow(rnd(), cfg.bias||1);
    const x = cfg.x0 + (cfg.x1-cfg.x0)*t;
    // density decays away from the anchored corner
    const edge = cfg.bias > 1 ? 1 - t : t;
    const y = rr(cfg.y0, cfg.y1) - edge*edge*(cfg.fade||70);
    const depth = clamp((y - cfg.y0)/(cfg.y1 - cfg.y0), 0, 1);
    const h = cfg.h0 + (cfg.h1-cfg.h0)*Math.pow(depth, 0.7)*rr(0.55, 1.3);
    trees.push({x, y, h, a: 0.34 + 0.62*depth*rr(0.75,1.2)});
  }
  trees.sort((p,q) => p.y - q.y);              // painter's order, far trees first
  for(const t of trees) drawConifer(g, t.x, t.y, t.h, clamp(t.a, 0.22, 0.95));
}

/* ------------------------------------------------------------------ *
 *  Static scene: dashed grid, ranges, logo
 * ------------------------------------------------------------------ */
// composition, normalised to the design box; mSpan slices it for narrow layouts
const PEAK_LAYERS = [
  { a:.34, k:.80, peaks:[   // far haze
    {px:.05,ph:.30,pw:.145,spurs:3,dip:16,jag:26,by:1.00},
    {px:.24,ph:.36,pw:.16, spurs:3,dip:16,jag:30,by:1.00},
    {px:.44,ph:.32,pw:.15, spurs:3,dip:16,jag:26,by:1.00},
    {px:.62,ph:.40,pw:.17, spurs:3,dip:16,jag:32,by:1.00},
    {px:.82,ph:.34,pw:.15, spurs:3,dip:16,jag:28,by:1.00},
    {px:.98,ph:.30,pw:.14, spurs:3,dip:16,jag:26,by:1.00}]},
  { a:.72, k:.92, peaks:[   // main skyline
    {px:.13,ph:.44,pw:.20, spurs:4,dip:26,jag:44,by:1.02},
    {px:.33,ph:.38,pw:.18, spurs:4,dip:24,jag:40,by:1.02},
    {px:.52,ph:.47,pw:.21, spurs:5,dip:26,jag:46,by:1.02},
    {px:.70,ph:.58,pw:.24, spurs:5,dip:30,jag:54,by:1.02},   // the tall one
    {px:.90,ph:.42,pw:.19, spurs:4,dip:24,jag:42,by:1.02}]},
  { a:.90, k:1.0, peaks:[   // mid
    {px:.02,ph:.36,pw:.21, spurs:4,dip:30,jag:44,by:1.06},
    {px:.22,ph:.42,pw:.23, spurs:5,dip:34,jag:50,by:1.06},
    {px:.45,ph:.33,pw:.20, spurs:4,dip:30,jag:42,by:1.06},
    {px:.67,ph:.38,pw:.22, spurs:5,dip:34,jag:48,by:1.06},
    {px:.88,ph:.44,pw:.23, spurs:5,dip:34,jag:50,by:1.06}]},
  { a:1.0, k:1.12, peaks:[  // foreground shoulders
    {px:-.02,ph:.34,pw:.26, spurs:5,dip:40,jag:52,by:1.12},
    {px:.20,ph:.27,pw:.22, spurs:4,dip:36,jag:44,by:1.12},
    {px:.55,ph:.22,pw:.24, spurs:4,dip:36,jag:40,by:1.14},
    {px:.83,ph:.30,pw:.26, spurs:5,dip:40,jag:48,by:1.12},
    {px:1.03,ph:.36,pw:.24,spurs:5,dip:40,jag:50,by:1.12}]},
];

function drawPeaks(g){
  const kx = DW/(1795*(L.mSpan||1));    // world scale for this layout
  let seed = 101;
  for(const layer of PEAK_LAYERS){
    const o = { a:layer.a, k:layer.k*kx, pen:new Pen(g) };
    for(const P of layer.peaks){
      const M = buildMountain({
        ax:(P.px - 0.5)*1795*kx + DW/2,
        ay:DH*P.by - P.ph*1125*kx,
        w: P.pw*1795*kx,
        by:DH*P.by,
        dip:P.dip*kx, jag:P.jag*kx,
        spurs:P.spurs, seed:(seed += 13)
      });
      drawMountain(g, M, o);
    }
  }
}

function drawGrid(g){
  g.save();
  g.strokeStyle = GRID;
  g.lineWidth = 1;
  g.setLineDash([7,7]);
  g.beginPath();
  g.moveTo(L.gx[0] - 0.039*DW, L.gy);
  g.lineTo(L.gx[L.gx.length-1] + 0.005*DW, L.gy);
  g.stroke();
  g.beginPath();
  for(const x of L.gx){ g.moveTo(x, L.gy); g.lineTo(x, DH*1.124); }
  g.stroke();
  g.restore();
}

function drawLogo(g){
  const cx = L.logoCX, cy = L.logoCY, markS = L.markS, gap = L.wordGap;
  g.save();
  g.font = '700 '+L.wordF+'px '+FONT;
  if('letterSpacing' in g) g.letterSpacing = (-L.wordF/41).toFixed(2)+'px';
  const word = 'QED';
  const wW = g.measureText(word).width;
  const left = cx - (markS + gap + wW)/2;
  // mark
  g.fillStyle = HEAD;
  g.fillRect(left, cy - markS/2, markS, markS);
  g.fillStyle = PAPER;
  g.fillRect(left + markS*0.30, cy - markS*0.20, markS*0.40, markS*0.40);
  // wordmark
  g.fillStyle = HEAD;
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  g.fillText(word, left + markS + gap, cy + L.wordF*0.355);
  if('letterSpacing' in g) g.letterSpacing = '0px';

  // tagline + copyright
  g.textAlign = 'center';
  g.fillStyle = MUTED;
  g.font = '400 '+L.tagF+'px '+FONT;
  g.fillText('The deterministic layer for', cx, L.tagY[0]);
  g.fillText('enterprise AI', cx, L.tagY[1]);
  g.fillText('© 2026 QED Labs, Inc.', cx, L.copyY);
  g.restore();
}

function buildScene(){
  const g = sctx;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,scene.width,scene.height);
  g.setTransform(S*DPR,0,0,S*DPR, offX*DPR, offY*DPR);
  rnd = mulberry32(20260828);
  drawGrid(g);
  drawPeaks(g);
  // foreground treeline hugging the bottom edge, dense at the outer corners
  const tk = DW/(1795*(L.mSpan||1));
  for(const b of [
    {x0:-0.134, x1:0.390, count:520, y0:0.860, y1:1.080, h0:12, h1:56, bias:2.6},
    {x0: 0.602, x1:1.148, count:560, y0:0.860, y1:1.080, h0:12, h1:56, bias:0.38},
    {x0: 0.345, x1:0.669, count:120, y0:0.920, y1:1.071, h0:10, h1:30, bias:1}
  ]) drawTreeband(g, {
    x0:b.x0*DW, x1:b.x1*DW, count:b.count, bias:b.bias,
    y0:DH*1.151 - (1.151-b.y0)*1125*tk,
    y1:DH*1.151 - (1.151-b.y1)*1125*tk,
    h0:b.h0*tk, h1:b.h1*tk, fade:70*tk
  });
  drawLogo(g);
}

/* ------------------------------------------------------------------ *
 *  Type (drawn every frame so hover states stay live)
 * ------------------------------------------------------------------ */
function drawType(g, live){
  g.save();
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  COLS.forEach((c, ci) => {
    g.fillStyle = HEAD;
    g.font = '500 '+L.headF+'px '+FONT;
    g.fillText(c.title, L.colCX[ci], L.headY);
  });
  g.font = '400 '+L.itemF+'px '+FONT;
  for(const it of links){
    const h = live ? it.h : 0;
    const y = it.y;
    it.w = g.measureText(it.label).width;
    // colour lifts from muted to ink on hover
    g.fillStyle = h > 0.01
      ? 'rgb('+Math.round(92-74*h)+','+Math.round(91-73*h)+','+Math.round(86-68*h)+')'
      : MUTED;
    g.fillText(it.label, it.x, y);
    if(h > 0.01){
      const half = it.w/2, uy = y + L.itemF*0.36;
      g.strokeStyle = 'rgba(26,26,24,'+(0.85*h)+')';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(it.x - half, uy);
      g.lineTo(it.x - half + it.w*h, uy);
      g.stroke();
      // leading tick
      g.beginPath();
      g.moveTo(it.x - half - L.tick, y - L.itemF*0.29);
      g.lineTo(it.x - half - L.tick + L.tickLen*h, y - L.itemF*0.29);
      g.stroke();
    }
  }
  g.restore();
}

/* ------------------------------------------------------------------ *
 *  Dissolve mask + ink map
 * ------------------------------------------------------------------ */
function buildMask(){
  MW = Math.max(2, Math.ceil(W/CELL));
  MH = Math.max(2, Math.ceil(H/CELL));
  maskCv.width = MW; maskCv.height = MH;
  maskImg = mctx.createImageData(MW, MH);
  thr = new Float32Array(MW*MH);
  const nr = mulberry32(913371);
  for(let j=0;j<MH;j++){
    for(let i=0;i<MW;i++){
      const xn = i/(MW-1);
      // clumps (drifting, low frequency) + per-cell grit
      const chunk = vnoise2(i/50, j/50, 4);      // whole pieces let go together
      const grain = vnoise2(i/16, j/16, 9);      // then break into smaller bits
      const n = chunk*0.40 + grain*0.30 + nr()*0.30;
      thr[i+j*MW] = xn*(1-EDGE) + n*EDGE;
    }
  }
  // ink density (for spawning flecks only where there is art)
  const tmp = document.createElement('canvas');
  tmp.width = MW; tmp.height = MH;
  const tg = tmp.getContext('2d', {willReadFrequently:true});
  tg.fillStyle = PAPER; tg.fillRect(0,0,MW,MH);
  tg.drawImage(scene, 0,0, MW, MH);
  tg.setTransform(S/CELL, 0, 0, S/CELL, offX/CELL, offY/CELL);
  drawType(tg, false);
  const d = tg.getImageData(0,0,MW,MH).data;
  ink = new Float32Array(MW*MH);
  for(let k=0;k<MW*MH;k++){
    const lum = (d[k*4]*0.3 + d[k*4+1]*0.59 + d[k*4+2]*0.11);
    ink[k] = clamp((236 - lum)/150, 0, 1);
  }
}

function paintMask(p){
  const px = maskImg.data;
  for(let k=0, n=MW*MH; k<n; k++){
    const a = (p - thr[k]) / RAMP;
    px[k*4+3] = a <= 0 ? 0 : a >= 1 ? 255 : (a*255)|0;
  }
  mctx.putImageData(maskImg, 0, 0);
}

/* ------------------------------------------------------------------ *
 *  Flecks along the live edge
 * ------------------------------------------------------------------ */
function spawn(p, speed, dir){
  const want = Math.min(70, Math.round(Math.abs(speed)*2300));
  if(want <= 0) return;
  const lo = Math.max(0, Math.floor((p - EDGE*1.1)*MW));
  const hi = Math.min(MW-1, Math.ceil((p + EDGE*0.6)*MW));
  if(hi <= lo) return;
  let made = 0, tries = 0;
  while(made < want && tries < want*14){
    tries++;
    const i = lo + ((Math.random()*(hi-lo))|0);
    const j = (Math.random()*MH)|0;
    const k = i + j*MW;
    if(ink[k] < 0.16) continue;
    if(Math.abs(thr[k] - p) > 0.042) continue;
    made++;
    const life = rr(0.34, 0.95);
    parts.push({
      x:(i + Math.random())*CELL,
      y:(j + Math.random())*CELL,
      vx: rr(6, 62) + Math.abs(speed)*140,
      vy: rr(-34, 20),
      rot: rr(-1, 1),
      len: rr(3.2, 11),
      w: rr(1.1, 2.6),
      a: rr(0.55, 1.0) * (0.45 + ink[k]),
      t: 0, life
    });
  }
  if(parts.length > 1600) parts.splice(0, parts.length-1600);
}

function stepParts(dt){
  for(let k=parts.length-1;k>=0;k--){
    const q = parts[k];
    q.t += dt;
    if(q.t >= q.life){ parts.splice(k,1); continue; }
    q.x += q.vx*dt;
    q.y += q.vy*dt;
    q.vy += 120*dt;              // slight settle
    q.vx *= (1 - 2.1*dt);
    q.rot += dt*1.4;
  }
}

function drawParts(g){
  g.save();
  g.lineCap = 'round';
  for(const q of parts){
    const f = q.t/q.life;
    const a = q.a * (1 - f)*(1 - f*0.6);
    if(a <= 0.02) continue;
    const dx = Math.cos(q.rot)*q.len, dy = Math.sin(q.rot)*q.len*0.55;
    g.strokeStyle = 'rgba(26,26,24,'+a.toFixed(3)+')';
    g.lineWidth = q.w;
    g.beginPath();
    g.moveTo(q.x-dx/2, q.y-dy/2);
    g.lineTo(q.x+dx/2, q.y+dy/2);
    g.stroke();
  }
  g.restore();
}

/* ------------------------------------------------------------------ *
 *  Timeline
 * ------------------------------------------------------------------ */
const T_BUILD = 2500, T_HOLD = 3400, T_ERODE = 2000, T_GAP = 800;
const T_TOTAL = T_BUILD + T_HOLD + T_ERODE + T_GAP;
let clock = 0, lastP = 0;

function progressAt(ms){
  const t = ms % T_TOTAL;
  if(t < T_BUILD) return {p: smooth(t/T_BUILD), dir: 1};
  if(t < T_BUILD+T_HOLD) return {p: 1, dir: 0};
  if(t < T_BUILD+T_HOLD+T_ERODE){
    const u = (t - T_BUILD - T_HOLD)/T_ERODE;
    return {p: 1 - smooth(u), dir: -1};
  }
  return {p: 0, dir: 0};
}

/* ------------------------------------------------------------------ *
 *  Frame
 * ------------------------------------------------------------------ */
function frame(dt){
  let p, dir;
  if(FREEZE !== null){ p = clamp(FREEZE,0,1); dir = 0; }
  else if(prefersStill){ p = 1; dir = 0; }
  else { clock += dt*1000; const s = progressAt(clock); p = s.p; dir = s.dir; }

  for(const L of links) L.h += (L.target - L.h) * Math.min(1, dt*11);

  // scene + type -> masked
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(scene, 0, 0);
  ctx.setTransform(S*DPR,0,0,S*DPR, offX*DPR, offY*DPR);
  drawType(ctx, true);
  ctx.setTransform(1,0,0,1,0,0);

  if(p < 0.999){
    paintMask(p);
    ctx.globalCompositeOperation = 'destination-in';
    // no smoothing: cells stay hard-edged so the front reads as broken ink
    // rather than a fade. CELL is small enough to read as grain, not squares.
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(maskCv, 0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = true;
  }
  ctx.globalCompositeOperation = 'destination-over';
  ctx.fillStyle = PAPER;
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalCompositeOperation = 'source-over';

  // flecks
  const speed = (p - lastP);
  lastP = p;
  if(!prefersStill && FREEZE === null && dir !== 0) spawn(p, speed/Math.max(dt,0.001)*0.016, dir);
  stepParts(dt);
  if(parts.length){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawParts(ctx);
    ctx.setTransform(1,0,0,1,0,0);
  }
  // links are only clickable once they have materialised
  hits.style.pointerEvents = p > 0.985 ? 'auto' : 'none';
}

/* ------------------------------------------------------------------ *
 *  Layout / resize / input
 * ------------------------------------------------------------------ */
function buildHits(){
  hits.innerHTML = '';
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = '400 '+L.itemF+'px '+FONT;
  for(const it of links){
    const w = probe.measureText(it.label).width;
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = it.label;
    a.setAttribute('aria-label', it.label);
    a.style.left   = (offX + (it.x - w/2 - 10)*S) + 'px';
    a.style.top    = (offY + (it.y - L.itemF)*S) + 'px';
    a.style.width  = ((w + 20)*S) + 'px';
    a.style.height = (L.itemF*1.45*S) + 'px';
    const on  = () => { it.target = 1; };
    const off = () => { it.target = 0; };
    a.addEventListener('mouseenter', on);
    a.addEventListener('mouseleave', off);
    a.addEventListener('focus', on);
    a.addEventListener('blur', off);
    a.addEventListener('click', e => e.preventDefault());
    hits.appendChild(a);
  }
}

function resize(){
  const r = document.getElementById('stagewrap').getBoundingClientRect();
  W = Math.max(320, Math.round(r.width));
  H = Math.max(240, Math.round(r.height));
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  cv.style.width = W+'px';
  cv.style.height = H+'px';

  applyLayout(W < 860 || W/H < 1.15 ? 'narrow' : 'wide');
  S = W/DW;                            // always fit the full width — never crop type
  offX = 0;
  // bottom-anchored so the range always meets the bottom edge; on short
  // viewports crop from the top, but never past the grid rule
  offY = Math.max(H - DH*S, -(L.gy - 20)*S);

  if(!scene){ scene = document.createElement('canvas'); sctx = scene.getContext('2d'); }
  scene.width = cv.width; scene.height = cv.height;
  if(!maskCv){ maskCv = document.createElement('canvas'); mctx = maskCv.getContext('2d', {willReadFrequently:true}); }

  buildScene();
  buildMask();
  buildHits();
  parts.length = 0;
}

let raf = 0, prev = 0, running = true;
function loop(ts){
  raf = requestAnimationFrame(loop);
  if(!prev) prev = ts;
  const dt = Math.min(0.05, (ts - prev)/1000);
  prev = ts;
  if(!running) return;
  frame(dt);
}

let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 180); });
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  prev = 0;
});
document.getElementById('replay').addEventListener('click', () => {
  clock = 0; lastP = 0; parts.length = 0;
});
addEventListener('keydown', e => {
  if(e.target !== document.body) return;
  if(e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    clock = 0; lastP = 0; parts.length = 0;
  }
});

resize();
if(FREEZE !== null || prefersStill){ frame(0.016); }
raf = requestAnimationFrame(loop);
window.__ready = true;
// test hook: jump the timeline to a given ms offset
window.__setClock = ms => { clock = ms; lastP = progressAt(ms).p; parts.length = 0; };
})();
</script>
</body>
</html>
